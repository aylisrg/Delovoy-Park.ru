# Сборка статики и публикация на корневой домен delovoy-park.ru.
# basePath НЕ используется (см. next.config.mjs) — ассеты отдаются с /_next/.
# Кастомный домен задаётся файлом public/CNAME.
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js app
        run: npm run build
        env:
          NODE_ENV: production
          # Опциональные параметры — задаются в Settings → Secrets and variables → Actions.
          # Если не заданы, счётчик/формы просто не активируются.
          NEXT_PUBLIC_YANDEX_METRIKA_ID: ${{ vars.NEXT_PUBLIC_YANDEX_METRIKA_ID }}
          NEXT_PUBLIC_FORMSPREE_WAITLIST_ID: ${{ vars.NEXT_PUBLIC_FORMSPREE_WAITLIST_ID }}
          NEXT_PUBLIC_FORMSPREE_CONTACT_ID: ${{ vars.NEXT_PUBLIC_FORMSPREE_CONTACT_ID }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
